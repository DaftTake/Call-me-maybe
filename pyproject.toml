[project]
name = "callme"
version = "0.1.0"
description = "Function calling tool for LLMs using constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pydantic>=2.0",
    "llm-sdk",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = [
    "cache/",
    "uv/",
    "data/",
    "llm_sdk/",
]
